name: keep-warm

# Render's free tier puts the backend to sleep after 15 idle minutes, and
# waking it took 42 s when measured on 2026-09-29: longer than a visitor
# waits after tapping a demo scenario. Our own startup is under a second;
# the rest is Render starting a container. A ping every 5 minutes keeps it
# awake. GitHub can start a scheduled run late under load, which is why the
# demo page also pings /healthz as it loads.
#
# The cost is Render's free hours: an always-awake service uses about 730 of
# the 750 a month, which fits only while SitRep is the workspace's one free
# service. To share them, narrow the hour field (UTC): "2-59/5 1-17 * * *" keeps
# it awake from 01:00 to about 18:15 UTC, roughly 530 hours a month. To stop,
# disable this workflow in the Actions tab.
#
# GitHub turns off scheduled workflows in a public repo after 60 days with no
# commits. If the repo goes quiet, re-enable it in the Actions tab.

on:
  schedule:
    # Every 5 minutes, at :02, :07 ... :57. Not 10: runs start late when
    # Actions is busy, and 10 minutes would leave only 5 before Render's
    # 15-minute sleep. Off the top of the hour, GitHub's busiest moment.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # --fail turns a non-2xx into a failed run, so a broken backend shows
      # up as a red run instead of a quietly green one.
      - run: >-
          curl --fail --silent --show-error --max-time 90 --output /dev/null
          https://sitrep-f734.onrender.com/healthz
