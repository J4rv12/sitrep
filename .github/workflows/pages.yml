name: pages

# Publishes demo/ to GitHub Pages, and nothing else: Pages can serve only a
# branch's root or docs/, and neither is the page. Runs when the page or this
# file changes.
#
# One-time setup on github.com: Settings > Pages > Source = "GitHub Actions".
# Without it the deploy step fails.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages proves who is deploying with an OIDC token.

# One deploy at a time. A newer push waits instead of cancelling a deploy
# halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
