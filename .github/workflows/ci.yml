name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Reads .python-version, the same file Render reads. One place to
          # bump the interpreter; CI and production cannot drift apart.
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .

      # No .env here, by design. conftest.py supplies the fake secrets, so a
      # green CI run proves the app boots from environment alone.
      - run: pytest
